<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Result Management System</title><link rel="stylesheet" href="style.css"></head><body><header><nav class="navbar"><h1>Student Result Management System</h1></nav></header><main><section class="form-section"><h2>Enter Student Details</h2><form id="resultForm"><div class="form-row"><div><label>Roll Number</label><input type="text" id="rollNo" required></div><div><label>Student Name</label><input type="text" id="studentName" required></div></div><h3>Enter Marks</h3><div class="marks-grid"><div><label>HTML</label><input type="number" id="html" min="0" max="100" required></div><div><label>CSS</label><input type="number" id="css" min="0" max="100" required></div><div><label>JavaScript</label><input type="number" id="javascript" min="0" max="100" required></div><div><label>DBMS</label><input type="number" id="dbms" min="0" max="100" required></div><div><label>Java</label><input type="number" id="java" min="0" max="100" required></div></div><button type="submit">Add Student Result</button><button type="reset" class="reset-btn">Reset</button></form></section><section class="topper-section"><h2>🏆 Topper</h2><div id="topper">No student record available.</div></section><section class="table-section"><h2>Student Result Records</h2><div class="table-container"><table><thead><tr><th>Roll No.</th><th>Name</th><th>HTML</th><th>CSS</th><th>JavaScript</th><th>DBMS</th><th>Java</th><th>Total</th><th>Percentage</th><th>Grade</th><th>Action</th></tr></thead><tbody id="studentTable"></tbody></table></div></section></main><footer><p>© 2026 Student Result Management System</p></footer><script src="script.js"></script></body></html>
